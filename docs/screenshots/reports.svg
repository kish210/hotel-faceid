<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Tahoma,Arial,sans-serif">
  <rect width="900" height="520" fill="#0f172a"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="200" height="520" fill="#1e293b"/>
  <text x="100" y="40" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Hotel Face-ID</text>
  <text x="100" y="90" fill="#94a3b8" font-size="11" text-anchor="middle">داشبورد</text>
  <text x="100" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">مهمانان</text>
  <text x="100" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">دوربین‌ها</text>
  <text x="100" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">هشدارها</text>
  <rect x="10" y="210" width="180" height="32" rx="6" fill="#0ea5e9"/>
  <text x="100" y="231" fill="#fff" font-size="12" text-anchor="middle">گزارش‌ها</text>

  <!-- topbar -->
  <rect x="200" y="0" width="700" height="52" fill="#1e293b"/>
  <text x="220" y="32" fill="#e2e8f0" font-size="14" font-weight="bold">گزارش روزانه تردد</text>
  <!-- date pickers -->
  <rect x="560" y="13" width="120" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="620" y="30" fill="#94a3b8" font-size="10" text-anchor="middle">از: ۱۴۰۳/۰۵/۰۱</text>
  <rect x="688" y="13" width="120" height="26" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="748" y="30" fill="#94a3b8" font-size="10" text-anchor="middle">تا: ۱۴۰۳/۰۵/۳۱</text>
  <rect x="816" y="13" width="64" height="26" rx="4" fill="#0ea5e9"/>
  <text x="848" y="30" fill="#fff" font-size="10" text-anchor="middle">نمایش</text>

  <!-- chart area -->
  <rect x="215" y="62" width="666" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="548" y="84" fill="#94a3b8" font-size="10" text-anchor="middle">تعداد ورود و خروج در ۳۰ روز گذشته</text>
  <!-- x axis -->
  <line x1="240" y1="245" x2="870" y2="245" stroke="#334155"/>
  <line x1="240" y1="100" x2="240" y2="245" stroke="#334155"/>
  <!-- grid lines -->
  <line x1="240" y1="210" x2="870" y2="210" stroke="#1e3a5f" stroke-dasharray="4"/>
  <line x1="240" y1="175" x2="870" y2="175" stroke="#1e3a5f" stroke-dasharray="4"/>
  <line x1="240" y1="140" x2="870" y2="140" stroke="#1e3a5f" stroke-dasharray="4"/>
  <line x1="240" y1="105" x2="870" y2="105" stroke="#1e3a5f" stroke-dasharray="4"/>
  <!-- y axis labels -->
  <text x="235" y="249" fill="#475569" font-size="8" text-anchor="end">۰</text>
  <text x="235" y="214" fill="#475569" font-size="8" text-anchor="end">۵۰</text>
  <text x="235" y="179" fill="#475569" font-size="8" text-anchor="end">۱۰۰</text>
  <text x="235" y="144" fill="#475569" font-size="8" text-anchor="end">۱۵۰</text>
  <text x="235" y="109" fill="#475569" font-size="8" text-anchor="end">۲۰۰</text>
