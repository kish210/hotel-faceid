    <text x="380" y="396" fill="#34d399">۱۴۳</text>
    <text x="470" y="396" fill="#f87171">۱۳۷</text>
    <text x="560" y="396" fill="#e2e8f0">۹۶</text>
    <text x="670" y="396" fill="#e2e8f0">۴۹</text>
    <text x="790" y="396" fill="#38bdf8">xlsx · pdf</text>
    <rect x="215" y="407" width="666" height="30" fill="#0f172a"/>
    <text x="260" y="426" fill="#e2e8f0">۱۴۰۳/۰۵/۲۸</text>
    <text x="380" y="426" fill="#34d399">۱۷۲</text>
    <text x="470" y="426" fill="#f87171">۱۶۵</text>
    <text x="560" y="426" fill="#e2e8f0">۱۱۸</text>
    <text x="670" y="426" fill="#e2e8f0">۵۸</text>
    <text x="790" y="426" fill="#38bdf8">xlsx · pdf</text>
