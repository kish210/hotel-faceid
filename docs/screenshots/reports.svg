  <!-- download all button -->
  <rect x="215" y="447" width="140" height="28" rx="5" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="285" y="465" fill="#38bdf8" font-size="10" text-anchor="middle">⬇ دانلود همه Excel</text>
  <rect x="363" y="447" width="140" height="28" rx="5" fill="#1e3a5f" stroke="#f87171" stroke-width="1"/>
  <text x="433" y="465" fill="#fca5a5" font-size="10" text-anchor="middle">⬇ دانلود همه PDF</text>

  <text x="450" y="510" fill="#475569" font-size="10" text-anchor="middle">Hotel Face-ID — گزارش روزانه</text>
</svg>
