    <rect x="372" y="130" width="10" height="115" fill="#f87171" opacity="0.8"/>
    <rect x="388" y="105" width="10" height="140" fill="#38bdf8" opacity="0.8"/>
    <rect x="400" y="115" width="10" height="130" fill="#f87171" opacity="0.8"/>
    <rect x="416" y="130" width="10" height="115" fill="#38bdf8" opacity="0.8"/>
    <rect x="428" y="140" width="10" height="105" fill="#f87171" opacity="0.8"/>
    <rect x="444" y="155" width="10" height="90" fill="#38bdf8" opacity="0.8"/>
    <rect x="456" y="165" width="10" height="80" fill="#f87171" opacity="0.8"/>
    <rect x="472" y="140" width="10" height="105" fill="#38bdf8" opacity="0.8"/>
    <rect x="484" y="148" width="10" height="97" fill="#f87171" opacity="0.8"/>
    <rect x="500" y="125" width="10" height="120" fill="#38bdf8" opacity="0.8"/>
    <rect x="512" y="135" width="10" height="110" fill="#f87171" opacity="0.8"/>
    <rect x="528" y="145" width="10" height="100" fill="#38bdf8" opacity="0.8"/>
    <rect x="540" y="155" width="10" height="90" fill="#f87171" opacity="0.8"/>
    <rect x="556" y="118" width="10" height="127" fill="#38bdf8" opacity="0.8"/>
    <rect x="568" y="128" width="10" height="117" fill="#f87171" opacity="0.8"/>
    <rect x="584" y="130" width="10" height="115" fill="#38bdf8" opacity="0.8"/>
    <rect x="596" y="140" width="10" height="105" fill="#f87171" opacity="0.8"/>
    <rect x="612" y="160" width="10" height="85" fill="#38bdf8" opacity="0.8"/>
    <rect x="624" y="170" width="10" height="75" fill="#f87171" opacity="0.8"/>
    <rect x="640" y="145" width="10" height="100" fill="#38bdf8" opacity="0.8"/>
    <rect x="652" y="155" width="10" height="90" fill="#f87171" opacity="0.8"/>
  </g>
  <!-- legend -->
  <rect x="780" y="95" width="10" height="10" fill="#38bdf8"/>
