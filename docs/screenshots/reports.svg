    <text x="380" y="366" fill="#34d399">۱۵۸</text>
    <text x="470" y="366" fill="#f87171">۱۴۱</text>
    <text x="560" y="366" fill="#e2e8f0">۱۰۲</text>
    <text x="670" y="366" fill="#e2e8f0">۵۳</text>
    <text x="790" y="366" fill="#38bdf8">xlsx · pdf</text>
