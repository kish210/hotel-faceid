<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Tahoma,Arial,sans-serif">
  <rect width="900" height="520" fill="#0f172a"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="200" height="520" fill="#1e293b"/>
  <text x="100" y="40" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Hotel Face-ID</text>
  <text x="100" y="90" fill="#94a3b8" font-size="11" text-anchor="middle">داشبورد</text>
  <rect x="10" y="105" width="180" height="32" rx="6" fill="#0ea5e9"/>
  <text x="100" y="126" fill="#fff" font-size="12" text-anchor="middle">مهمانان</text>
  <text x="100" y="165" fill="#94a3b8" font-size="11" text-anchor="middle">دوربین‌ها</text>
  <text x="100" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">هشدارها</text>
  <text x="100" y="235" fill="#94a3b8" font-size="11" text-anchor="middle">گزارش‌ها</text>
  <!-- topbar -->
  <rect x="200" y="0" width="700" height="52" fill="#1e293b"/>
  <text x="220" y="32" fill="#e2e8f0" font-size="14" font-weight="bold">فهرست مهمانان</text>
  <rect x="650" y="14" width="110" height="26" rx="5" fill="#0ea5e9"/>
  <text x="705" y="31" fill="#fff" font-size="11" text-anchor="middle">+ جست‌وجوی تصویری</text>
  <!-- search bar -->
  <rect x="215" y="62" width="340" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="225" y="82" fill="#475569" font-size="11">🔍  جست‌وجو در نام، شناسه یا شماره اتاق…</text>
  <!-- filter badges -->
  <rect x="565" y="62" width="70" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="82" fill="#94a3b8" font-size="10" text-anchor="middle">همه</text>
  <rect x="643" y="62" width="70" height="32" rx="6" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="678" y="82" fill="#38bdf8" font-size="10" text-anchor="middle">حاضر</text>
  <rect x="721" y="62" width="70" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="756" y="82" fill="#94a3b8" font-size="10" text-anchor="middle">خروجی</text>

  <!-- table header -->
  <rect x="215" y="104" width="666" height="32" rx="4" fill="#334155"/>
  <text x="260" y="124" fill="#94a3b8" font-size="10">شناسه</text>
  <text x="360" y="124" fill="#94a3b8" font-size="10">آخرین تشخیص</text>
  <text x="510" y="124" fill="#94a3b8" font-size="10">جنسیت/سن</text>
  <text x="620" y="124" fill="#94a3b8" font-size="10">شب اقامت</text>
  <text x="720" y="124" fill="#94a3b8" font-size="10">وضعیت</text>
  <text x="835" y="124" fill="#94a3b8" font-size="10">اقدام</text>

  <!-- rows -->
  <g font-size="11">
    <!-- row 1 -->
    <rect x="215" y="136" width="666" height="44" rx="0" fill="#1e293b"/>
    <circle cx="250" cy="158" r="16" fill="#334155"/>
    <text x="250" y="162" fill="#38bdf8" font-size="10" text-anchor="middle">#۴۸۱</text>
    <text x="340" y="155" fill="#e2e8f0" font-size="10">شناسه ۴۸۱</text>
    <text x="340" y="170" fill="#475569" font-size="9">بدون نام</text>
    <text x="400" y="161" fill="#94a3b8" font-size="9">۱۴:۲۳ امروز</text>
    <text x="510" y="161" fill="#60a5fa" font-size="10">مرد · ۳۵ س</text>
    <text x="620" y="161" fill="#e2e8f0" font-size="10">۲ شب</text>
    <rect x="715" y="147" width="48" height="20" rx="10" fill="#064e3b"/>
    <text x="739" y="161" fill="#34d399" font-size="9" text-anchor="middle">حاضر</text>
    <text x="835" y="161" fill="#38bdf8" font-size="10">مشاهده</text>
    <line x1="215" y1="180" x2="881" y2="180" stroke="#1e3a5f" stroke-width="1"/>

    <!-- row 2 -->
    <rect x="215" y="180" width="666" height="44" rx="0" fill="#0f172a"/>
    <circle cx="250" cy="202" r="16" fill="#334155"/>
    <text x="250" y="206" fill="#38bdf8" font-size="10" text-anchor="middle">#۳۲۲</text>
    <text x="340" y="199" fill="#e2e8f0" font-size="10">علی محمدی</text>
    <text x="340" y="214" fill="#475569" font-size="9">اتاق ۲۰۴</text>
    <text x="400" y="205" fill="#94a3b8" font-size="9">۱۴:۲۱ امروز</text>
    <text x="510" y="205" fill="#60a5fa" font-size="10">مرد · ۴۲ س</text>
    <text x="620" y="205" fill="#e2e8f0" font-size="10">۵ شب</text>
    <rect x="715" y="191" width="48" height="20" rx="10" fill="#1c1917"/>
    <text x="739" y="205" fill="#94a3b8" font-size="9" text-anchor="middle">خارج</text>
    <text x="835" y="205" fill="#38bdf8" font-size="10">مشاهده</text>
    <line x1="215" y1="224" x2="881" y2="224" stroke="#1e3a5f" stroke-width="1"/>

    <!-- row 3 -->
    <rect x="215" y="224" width="666" height="44" rx="0" fill="#1e293b"/>
    <circle cx="250" cy="246" r="16" fill="#334155"/>
    <text x="250" y="250" fill="#38bdf8" font-size="10" text-anchor="middle">#۴۷۸</text>
    <text x="340" y="243" fill="#e2e8f0" font-size="10">سارا احمدی</text>
    <text x="340" y="258" fill="#475569" font-size="9">اتاق ۱۱۲</text>
    <text x="400" y="249" fill="#94a3b8" font-size="9">۱۴:۱۵ امروز</text>
    <text x="510" y="249" fill="#f472b6" font-size="10">زن · ۲۸ س</text>
    <text x="620" y="249" fill="#e2e8f0" font-size="10">۱ شب</text>
    <rect x="715" y="235" width="48" height="20" rx="10" fill="#064e3b"/>
    <text x="739" y="249" fill="#34d399" font-size="9" text-anchor="middle">حاضر</text>
    <text x="835" y="249" fill="#38bdf8" font-size="10">مشاهده</text>
    <line x1="215" y1="268" x2="881" y2="268" stroke="#1e3a5f" stroke-width="1"/>

    <!-- row 4 -->
    <rect x="215" y="268" width="666" height="44" rx="0" fill="#0f172a"/>
    <circle cx="250" cy="290" r="16" fill="#334155"/>
    <text x="250" y="294" fill="#f59e0b" font-size="8" text-anchor="middle">#۴۷۷</text>
    <text x="340" y="287" fill="#e2e8f0" font-size="10">شناسه ۴۷۷</text>
    <text x="340" y="302" fill="#475569" font-size="9">بدون نام</text>
    <text x="400" y="293" fill="#94a3b8" font-size="9">۱۳:۵۸ امروز</text>
    <text x="510" y="293" fill="#94a3b8" font-size="10">نامشخص</text>
    <text x="620" y="293" fill="#e2e8f0" font-size="10">۰ شب</text>
    <rect x="715" y="279" width="48" height="20" rx="10" fill="#064e3b"/>
    <text x="739" y="293" fill="#34d399" font-size="9" text-anchor="middle">حاضر</text>
    <text x="835" y="293" fill="#38bdf8" font-size="10">مشاهده</text>
    <line x1="215" y1="312" x2="881" y2="312" stroke="#1e3a5f" stroke-width="1"/>

    <!-- row 5 -->
    <rect x="215" y="312" width="666" height="44" fill="#1e293b"/>
    <circle cx="250" cy="334" r="16" fill="#334155"/>
    <text x="250" y="338" fill="#38bdf8" font-size="10" text-anchor="middle">#۴۰۱</text>
    <text x="340" y="331" fill="#e2e8f0" font-size="10">رضا حسینی</text>
    <text x="340" y="346" fill="#475569" font-size="9">اتاق ۳۰۸</text>
    <text x="400" y="337" fill="#94a3b8" font-size="9">دیروز ۲۲:۱۰</text>
    <text x="510" y="337" fill="#60a5fa" font-size="10">مرد · ۵۱ س</text>
    <text x="620" y="337" fill="#e2e8f0" font-size="10">۸ شب</text>
    <rect x="715" y="323" width="48" height="20" rx="10" fill="#064e3b"/>
    <text x="739" y="337" fill="#34d399" font-size="9" text-anchor="middle">حاضر</text>
    <text x="835" y="337" fill="#38bdf8" font-size="10">مشاهده</text>
  </g>

  <!-- pagination -->
  <text x="550" y="490" fill="#475569" font-size="10" text-anchor="middle">صفحه ۱ از ۲۴  ·  ۴۷ نفر حاضر از مجموع ۴۸۱ مهمان</text>
  <text x="450" y="510" fill="#475569" font-size="10" text-anchor="middle">Hotel Face-ID — فهرست مهمانان</text>
</svg>
