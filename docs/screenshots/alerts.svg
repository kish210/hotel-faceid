<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Tahoma,Arial,sans-serif">
  <rect width="900" height="520" fill="#0f172a"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="200" height="520" fill="#1e293b"/>
  <text x="100" y="40" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Hotel Face-ID</text>
  <text x="100" y="90" fill="#94a3b8" font-size="11" text-anchor="middle">داشبورد</text>
  <text x="100" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">مهمانان</text>
  <text x="100" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">دوربین‌ها</text>
  <rect x="10" y="175" width="180" height="32" rx="6" fill="#dc2626"/>
  <text x="100" y="196" fill="#fff" font-size="12" text-anchor="middle">🔔 هشدارها</text>
  <text x="100" y="235" fill="#94a3b8" font-size="11" text-anchor="middle">گزارش‌ها</text>
  <!-- topbar -->
  <rect x="200" y="0" width="700" height="52" fill="#1e293b"/>
  <text x="220" y="32" fill="#e2e8f0" font-size="14" font-weight="bold">هشدارها</text>
  <rect x="730" y="14" width="150" height="26" rx="5" fill="#334155"/>
  <text x="805" y="31" fill="#94a3b8" font-size="10" text-anchor="middle">نمایش: رسیدگی‌نشده ▾</text>

  <!-- alert row 1 — fight -->
  <rect x="215" y="60" width="666" height="90" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="1"/>
  <rect x="215" y="60" width="80" height="90" rx="8" fill="#1c1917"/>
  <!-- thumbnail placeholder -->
  <text x="255" y="112" fill="#475569" font-size="24" text-anchor="middle">🎬</text>
  <rect x="230" y="62" width="50" height="16" rx="3" fill="#dc2626"/>
  <text x="255" y="73" fill="#fff" font-size="8" text-anchor="middle">بحرانی</text>
  <text x="315" y="82" fill="#fca5a5" font-size="12" font-weight="bold">درگیری و نزاع</text>
  <text x="315" y="97" fill="#94a3b8" font-size="10">دوربین: ورودی لابی · ۱۴:۱۸ امروز</text>
  <text x="315" y="112" fill="#e2e8f0" font-size="10">شدت حرکت ۸۴٪ · ۳ نفر در کادر · مدت ۱۲ ثانیه</text>
  <text x="315" y="128" fill="#475569" font-size="9">رسیدگی‌نشده</text>
  <rect x="760" y="75" width="100" height="26" rx="5" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="810" y="92" fill="#38bdf8" font-size="10" text-anchor="middle">✓ رسیدگی شد</text>

  <!-- alert row 2 — intrusion -->
  <rect x="215" y="162" width="666" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <rect x="215" y="162" width="80" height="90" rx="8" fill="#1c1917"/>
  <text x="255" y="214" fill="#475569" font-size="24" text-anchor="middle">🎬</text>
  <rect x="230" y="164" width="50" height="16" rx="3" fill="#b45309"/>
  <text x="255" y="175" fill="#fff" font-size="8" text-anchor="middle">هشدار</text>
  <text x="315" y="184" fill="#fcd34d" font-size="12" font-weight="bold">ورود به منطقهٔ ممنوعه</text>
  <text x="315" y="199" fill="#94a3b8" font-size="10">دوربین: انبار B · ۱۳:۴۵ امروز</text>
  <text x="315" y="214" fill="#e2e8f0" font-size="10">حرکت در ناحیه ممنوعه · ساعت خارج از بازه مجاز</text>
  <text x="315" y="230" fill="#475569" font-size="9">رسیدگی‌نشده</text>
  <rect x="760" y="177" width="100" height="26" rx="5" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="810" y="194" fill="#38bdf8" font-size="10" text-anchor="middle">✓ رسیدگی شد</text>

  <!-- alert row 3 — loitering, resolved -->
  <rect x="215" y="264" width="666" height="90" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1" opacity="0.7"/>
  <rect x="215" y="264" width="80" height="90" rx="8" fill="#0f172a" opacity="0.6"/>
  <text x="255" y="316" fill="#334155" font-size="24" text-anchor="middle">🎬</text>
  <rect x="230" y="266" width="50" height="16" rx="3" fill="#334155"/>
  <text x="255" y="277" fill="#94a3b8" font-size="8" text-anchor="middle">اطلاع</text>
  <text x="315" y="286" fill="#64748b" font-size="12" font-weight="bold">پرسه‌زنی</text>
  <text x="315" y="301" fill="#475569" font-size="10">دوربین: پارکینگ · ۱۱:۳۰ دیروز</text>
  <text x="315" y="316" fill="#475569" font-size="10">فرد ۲۲ دقیقه در یک نقطه ایستاده</text>
  <text x="315" y="332" fill="#34d399" font-size="9">✓ رسیدگی شد توسط admin</text>

  <!-- alert row 4 — watched person -->
  <rect x="215" y="366" width="666" height="90" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1"/>
  <rect x="215" y="366" width="80" height="90" rx="8" fill="#2e1065"/>
  <text x="255" y="418" fill="#7c3aed" font-size="24" text-anchor="middle">👁</text>
  <rect x="230" y="368" width="50" height="16" rx="3" fill="#7c3aed"/>
  <text x="255" y="379" fill="#fff" font-size="8" text-anchor="middle">زیر نظر</text>
  <text x="315" y="388" fill="#c4b5fd" font-size="12" font-weight="bold">فرد تحت نظر شناسایی شد</text>
  <text x="315" y="403" fill="#94a3b8" font-size="10">دوربین: درب ورودی فرعی · ۱۳:۵۵ امروز</text>
  <text x="315" y="418" fill="#e2e8f0" font-size="10">شناسه #۲۱۷ · دلیل: رفتار مشکوک (ثبت‌شده توسط مدیر)</text>
  <text x="315" y="434" fill="#475569" font-size="9">رسیدگی‌نشده</text>
  <rect x="760" y="381" width="100" height="26" rx="5" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="810" y="398" fill="#38bdf8" font-size="10" text-anchor="middle">✓ رسیدگی شد</text>

  <text x="450" y="510" fill="#475569" font-size="10" text-anchor="middle">Hotel Face-ID — هشدارها</text>
</svg>
