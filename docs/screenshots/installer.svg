<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Tahoma,Arial,sans-serif">
  <rect width="900" height="520" fill="#0f172a"/>

  <!-- Windows 11 installer window chrome -->
  <rect x="100" y="30" width="700" height="460" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <!-- title bar -->
  <rect x="100" y="30" width="700" height="36" rx="8" fill="#f8fafc"/>
  <rect x="100" y="50" width="700" height="16" fill="#f8fafc"/>
  <text x="450" y="52" fill="#1e293b" font-size="12" text-anchor="middle">Hotel Face-ID Setup v1.4.0</text>
  <circle cx="772" cy="48" r="7" fill="#ef4444"/>
  <circle cx="754" cy="48" r="7" fill="#f59e0b"/>
  <circle cx="736" cy="48" r="7" fill="#22c55e"/>

  <!-- wizard left panel -->
  <rect x="100" y="66" width="200" height="424" rx="0" fill="#1e3a5f"/>
  <text x="200" y="115" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">Hotel</text>
  <text x="200" y="135" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">Face-ID</text>
  <text x="200" y="165" fill="#93c5fd" font-size="10" text-anchor="middle">سامانه هوشمند</text>
  <text x="200" y="180" fill="#93c5fd" font-size="10" text-anchor="middle">تشخیص چهره</text>

  <!-- steps in sidebar -->
  <circle cx="160" cy="250" r="12" fill="#22c55e"/>
  <text x="160" y="254" fill="#fff" font-size="10" text-anchor="middle">✓</text>
  <text x="182" y="254" fill="#86efac" font-size="10">خوش‌آمدید</text>

  <circle cx="160" cy="285" r="12" fill="#38bdf8"/>
  <text x="160" y="289" fill="#fff" font-size="10" text-anchor="middle">2</text>
  <text x="182" y="289" fill="#fff" font-size="10">مسیر نصب</text>

  <circle cx="160" cy="320" r="12" fill="#334155"/>
  <text x="160" y="324" fill="#94a3b8" font-size="10" text-anchor="middle">3</text>
  <text x="182" y="324" fill="#94a3b8" font-size="10">تنظیمات</text>

  <circle cx="160" cy="355" r="12" fill="#334155"/>
  <text x="160" y="359" fill="#94a3b8" font-size="10" text-anchor="middle">4</text>
  <text x="182" y="359" fill="#94a3b8" font-size="10">نصب</text>

  <circle cx="160" cy="390" r="12" fill="#334155"/>
  <text x="160" y="394" fill="#94a3b8" font-size="10" text-anchor="middle">5</text>
  <text x="182" y="394" fill="#94a3b8" font-size="10">پایان</text>

  <!-- right panel -->
  <text x="560" y="110" fill="#1e293b" font-size="18" font-weight="bold" text-anchor="middle">مسیر نصب</text>
  <line x1="310" y1="120" x2="790" y2="120" stroke="#e2e8f0"/>

  <text x="320" y="155" fill="#475569" font-size="11">پوشهٔ نصب:</text>
  <rect x="320" y="164" width="390" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="334" y="184" fill="#1e293b" font-size="11">C:\HotelFaceID</text>
  <rect x="716" y="164" width="64" height="30" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="748" y="184" fill="#475569" font-size="10" text-anchor="middle">Browse</text>

  <text x="320" y="220" fill="#475569" font-size="10">فضای مورد نیاز: ۲.۴ گیگابایت   ·   فضای خالی: ۱۱۲ گیگابایت</text>

  <!-- checkboxes -->
  <rect x="320" y="240" width="14" height="14" rx="2" fill="#3b82f6"/>
  <text x="327" y="251" fill="#fff" font-size="10" text-anchor="middle">✓</text>
  <text x="342" y="252" fill="#1e293b" font-size="11">ایجاد میان‌برهای دسکتاپ و منوی استارت</text>

  <rect x="320" y="264" width="14" height="14" rx="2" fill="#3b82f6"/>
  <text x="327" y="275" fill="#fff" font-size="10" text-anchor="middle">✓</text>
  <text x="342" y="276" fill="#1e293b" font-size="11">اجرای خودکار هنگام روشن شدن ویندوز</text>

  <rect x="320" y="288" width="14" height="14" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="342" y="300" fill="#1e293b" font-size="11">اضافه‌کردن قانون فایروال (پورت ۸۰۰۰)</text>
  <text x="342" y="313" fill="#94a3b8" font-size="9">اگر می‌خواهید از سایر کامپیوترهای شبکه دسترسی داشته باشید</text>

  <!-- info box -->
  <rect x="320" y="335" width="460" height="65" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="334" y="355" fill="#1d4ed8" font-size="10" font-weight="bold">ℹ  این بسته کاملاً خودکفاست</text>
  <text x="334" y="372" fill="#3b82f6" font-size="10">موتور پایتون، مدل‌های InsightFace و همهٔ کتابخانه‌ها</text>
  <text x="334" y="387" fill="#3b82f6" font-size="10">داخل بسته هستند — اینترنت لازم نیست.</text>

  <!-- nav buttons -->
  <rect x="620" y="450" width="80" height="30" rx="4" fill="#3b82f6"/>
  <text x="660" y="469" fill="#fff" font-size="12" text-anchor="middle">بعدی ›</text>
  <rect x="530" y="450" width="80" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="570" y="469" fill="#475569" font-size="12" text-anchor="middle">‹ قبلی</text>
  <rect x="720" y="450" width="70" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="755" y="469" fill="#94a3b8" font-size="12" text-anchor="middle">لغو</text>

  <!-- outer label -->
  <text x="450" y="508" fill="#475569" font-size="10" text-anchor="middle">Hotel Face-ID — نصب‌کننده ویندوز (Inno Setup)</text>
</svg>
