<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Tahoma,Arial,sans-serif">
  <!-- background -->
  <rect width="900" height="520" fill="#0f172a"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="200" height="520" fill="#1e293b"/>
  <text x="100" y="40" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Hotel Face-ID</text>
  <rect x="10" y="60" width="180" height="32" rx="6" fill="#0ea5e9"/>
  <text x="100" y="81" fill="#fff" font-size="12" text-anchor="middle">داشبورد</text>
  <text x="100" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">مهمانان</text>
  <text x="100" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">دوربین‌ها</text>
  <text x="100" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">هشدارها</text>
  <text x="100" y="230" fill="#94a3b8" font-size="11" text-anchor="middle">گزارش‌ها</text>
  <text x="100" y="265" fill="#94a3b8" font-size="11" text-anchor="middle">کاربران</text>

  <!-- topbar -->
  <rect x="200" y="0" width="700" height="52" fill="#1e293b"/>
  <text x="860" y="32" fill="#94a3b8" font-size="12" text-anchor="end">admin ▾</text>
  <text x="220" y="32" fill="#e2e8f0" font-size="14" font-weight="bold">داشبورد لحظه‌ای</text>

  <!-- stat cards -->
  <!-- card 1: occupancy -->
  <rect x="215" y="65" width="155" height="90" rx="8" fill="#1e3a5f"/>
  <text x="292" y="91" fill="#94a3b8" font-size="11" text-anchor="middle">نفرات حاضر</text>
  <text x="292" y="130" fill="#38bdf8" font-size="34" font-weight="bold" text-anchor="middle">47</text>

  <!-- card 2: males -->
  <rect x="382" y="65" width="155" height="90" rx="8" fill="#1e3a5f"/>
  <text x="459" y="91" fill="#94a3b8" font-size="11" text-anchor="middle">آقایان</text>
  <text x="459" y="130" fill="#60a5fa" font-size="34" font-weight="bold" text-anchor="middle">28</text>

  <!-- card 3: females -->
  <rect x="549" y="65" width="155" height="90" rx="8" fill="#1e3a5f"/>
  <text x="626" y="91" fill="#94a3b8" font-size="11" text-anchor="middle">بانوان</text>
  <text x="626" y="130" fill="#f472b6" font-size="34" font-weight="bold" text-anchor="middle">19</text>

  <!-- card 4: entries today -->
  <rect x="716" y="65" width="165" height="90" rx="8" fill="#1e3a5f"/>
  <text x="798" y="91" fill="#94a3b8" font-size="11" text-anchor="middle">ورود امروز</text>
  <text x="798" y="130" fill="#34d399" font-size="34" font-weight="bold" text-anchor="middle">132</text>

  <!-- chart area -->
  <rect x="215" y="170" width="450" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="440" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">ورود / خروج ۲۴ ساعت گذشته</text>
  <!-- simple bar chart -->
  <g transform="translate(235,340)">
    <line x1="0" y1="0" x2="410" y2="0" stroke="#334155"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#334155"/>
    <!-- entry bars (blue) -->
    <rect x="5"   y="-40"  width="12" height="40"  fill="#38bdf8" opacity="0.8"/>
    <rect x="23"  y="-55"  width="12" height="55"  fill="#38bdf8" opacity="0.8"/>
    <rect x="41"  y="-30"  width="12" height="30"  fill="#38bdf8" opacity="0.8"/>
    <rect x="59"  y="-70"  width="12" height="70"  fill="#38bdf8" opacity="0.8"/>
    <rect x="77"  y="-90"  width="12" height="90"  fill="#38bdf8" opacity="0.8"/>
    <rect x="95"  y="-110" width="12" height="110" fill="#38bdf8" opacity="0.8"/>
    <rect x="113" y="-95"  width="12" height="95"  fill="#38bdf8" opacity="0.8"/>
    <rect x="131" y="-60"  width="12" height="60"  fill="#38bdf8" opacity="0.8"/>
    <rect x="149" y="-45"  width="12" height="45"  fill="#38bdf8" opacity="0.8"/>
    <rect x="167" y="-35"  width="12" height="35"  fill="#38bdf8" opacity="0.8"/>
    <rect x="185" y="-20"  width="12" height="20"  fill="#38bdf8" opacity="0.8"/>
    <rect x="203" y="-15"  width="12" height="15"  fill="#38bdf8" opacity="0.8"/>
    <!-- exit bars (red) -->
    <rect x="17"  y="-25"  width="12" height="25"  fill="#f87171" opacity="0.8"/>
    <rect x="35"  y="-40"  width="12" height="40"  fill="#f87171" opacity="0.8"/>
    <rect x="53"  y="-20"  width="12" height="20"  fill="#f87171" opacity="0.8"/>
    <rect x="71"  y="-55"  width="12" height="55"  fill="#f87171" opacity="0.8"/>
    <rect x="89"  y="-75"  width="12" height="75"  fill="#f87171" opacity="0.8"/>
    <rect x="107" y="-85"  width="12" height="85"  fill="#f87171" opacity="0.8"/>
    <rect x="125" y="-70"  width="12" height="70"  fill="#f87171" opacity="0.8"/>
    <rect x="143" y="-50"  width="12" height="50"  fill="#f87171" opacity="0.8"/>
    <rect x="161" y="-30"  width="12" height="30"  fill="#f87171" opacity="0.8"/>
    <rect x="179" y="-25"  width="12" height="25"  fill="#f87171" opacity="0.8"/>
    <rect x="197" y="-12"  width="12" height="12"  fill="#f87171" opacity="0.8"/>
    <rect x="215" y="-8"   width="12" height="8"   fill="#f87171" opacity="0.8"/>
    <!-- legend -->
    <rect x="280" y="-115" width="10" height="10" fill="#38bdf8"/>
    <text x="294" y="-106" fill="#94a3b8" font-size="9">ورود</text>
    <rect x="330" y="-115" width="10" height="10" fill="#f87171"/>
    <text x="344" y="-106" fill="#94a3b8" font-size="9">خروج</text>
  </g>

  <!-- recent events panel -->
  <rect x="675" y="170" width="206" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="778" y="195" fill="#94a3b8" font-size="11" text-anchor="middle">آخرین رویدادها</text>
  <line x1="685" y1="202" x2="871" y2="202" stroke="#334155"/>
  <!-- event rows -->
  <circle cx="700" cy="222" r="14" fill="#334155"/>
  <text x="700" cy="227" fill="#94a3b8" font-size="8" text-anchor="middle" dominant-baseline="middle">👤</text>
  <text x="720" y="218" fill="#e2e8f0" font-size="9">شناسه #۴۸۱</text>
  <text x="720" y="231" fill="#34d399" font-size="8">ورود · لابی · ۱۴:۲۳</text>

  <circle cx="700" cy="256" r="14" fill="#334155"/>
  <text x="720" y="252" fill="#e2e8f0" font-size="9">شناسه #۳۲۲</text>
  <text x="720" y="265" fill="#f87171" font-size="8">خروج · پارکینگ · ۱۴:۲۱</text>

  <circle cx="700" cy="290" r="14" fill="#334155"/>
  <text x="720" y="286" fill="#e2e8f0" font-size="9">شناسه #۴۸۰</text>
  <text x="720" y="299" fill="#34d399" font-size="8">ورود · لابی · ۱۴:۱۹</text>

  <circle cx="700" cy="324" r="14" fill="#334155"/>
  <text x="720" y="320" fill="#e2e8f0" font-size="9">شناسه #۴۷۹</text>
  <text x="720" y="333" fill="#34d399" font-size="8">ورود · درب فرعی · ۱۴:۱۷</text>

  <!-- live dot -->
  <circle cx="858" cy="182" r="5" fill="#34d399"/>
  <text x="848" y="186" fill="#34d399" font-size="9" text-anchor="end">زنده</text>

  <!-- bottom footer hint -->
  <text x="450" y="510" fill="#475569" font-size="10" text-anchor="middle">Hotel Face-ID — داشبورد مدیریت هتل</text>
</svg>
