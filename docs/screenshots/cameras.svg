  <rect x="428" y="142" width="200" height="20" fill="#0f2744"/>
  <text x="528" y="118" fill="#94a3b8" font-size="22" text-anchor="middle">📷</text>
  <circle cx="611" cy="74" r="5" fill="#34d399"/>
  <text x="601" y="78" fill="#34d399" font-size="8" text-anchor="end">آنلاین</text>
  <text x="528" y="182" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="bold">درب خروجی</text>
  <text x="528" y="198" fill="#94a3b8" font-size="9" text-anchor="middle">Dahua IPC-HDW2831T · 192.168.1.65</text>
  <text x="528" y="213" fill="#f87171" font-size="9" text-anchor="middle">exit · پردازش RTSP</text>
  <rect x="438" y="221" width="80" height="22" rx="4" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="478" y="235" fill="#38bdf8" font-size="9" text-anchor="middle">✎ ویرایش</text>
  <rect x="528" y="221" width="90" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="573" y="235" fill="#94a3b8" font-size="9" text-anchor="middle">⚙ تشخیص مدل</text>

  <!-- camera card 3 — offline -->
  <rect x="641" y="62" width="200" height="175" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="641" y="62" width="200" height="100" rx="10" fill="#1c1917"/>
  <rect x="641" y="142" width="200" height="20" fill="#1c1917"/>
  <text x="741" y="118" fill="#475569" font-size="22" text-anchor="middle">📷</text>
  <circle cx="824" cy="74" r="5" fill="#f87171"/>
  <text x="814" y="78" fill="#f87171" font-size="8" text-anchor="end">آفلاین</text>
  <text x="741" y="182" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="bold">پارکینگ</text>
  <text x="741" y="198" fill="#94a3b8" font-size="9" text-anchor="middle">Axis M3106-L · 192.168.1.66</text>
  <text x="741" y="213" fill="#f59e0b" font-size="9" text-anchor="middle">bidirectional · قطع ارتباط</text>
  <rect x="651" y="221" width="80" height="22" rx="4" fill="#1e3a5f" stroke="#0ea5e9" stroke-width="1"/>
  <text x="691" y="235" fill="#38bdf8" font-size="9" text-anchor="middle">✎ ویرایش</text>
  <rect x="741" y="221" width="90" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="786" y="235" fill="#94a3b8" font-size="9" text-anchor="middle">⚙ تشخیص مدل</text>

  <!-- Auto-probe dialog -->
  <rect x="240" y="280" width="420" height="200" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <text x="450" y="308" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">تشخیص خودکار مدل دوربین</text>
