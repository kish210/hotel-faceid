  <rect x="360" y="389" width="160" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="370" y="405" fill="#475569" font-size="10">••••••••</text>
  <!-- result badge -->
  <rect x="270" y="423" width="340" height="28" rx="6" fill="#064e3b"/>
  <text x="440" y="441" fill="#34d399" font-size="10" text-anchor="middle">✓ Hikvision DS-2CD2T47G2  ·  فریم‌ور 5.7.15  ·  موتور چهره: پشتیبانی می‌شود</text>
  <rect x="550" y="432" width="60" height="22" rx="4" fill="#0ea5e9"/>
  <text x="580" y="447" fill="#fff" font-size="10" text-anchor="middle">ثبت کن</text>

  <text x="450" y="510" fill="#475569" font-size="10" text-anchor="middle">Hotel Face-ID — مدیریت دوربین‌ها</text>
