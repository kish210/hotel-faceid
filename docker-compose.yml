services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_faceid}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Override POSTGRES_PORT if 5432 is already taken on the host.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@db:5432/${POSTGRES_DB:-hotel_faceid}
      FACE_SERVICE_URL: http://face-service:8001
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  face-service:
    build: ./services/face-service
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - media:/data/media
      - models:/root/.insightface
    depends_on:
      - api
    # Uncomment on a GPU host (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-4000}:80"
    depends_on:
      - api

volumes:
  pgdata:
  media:
  models:
